solve_at_6:
  title: Solve@6
  definition: Fraction of games solved within six decision rounds.
  why_it_matters: Measures eventual task-solving success.
  direction: higher
  caveats: [Normal and strict mode differ in whether inconsistent legal guesses receive feedback.]
mean_round_score:
  title: Mean score
  definition: Mean solve round, with unsolved games scored as 7.
  why_it_matters: Combines solving success and decision-round efficiency.
  direction: lower
  caveats: [A lower value is better.]
initial_action_valid_at_1:
  title: Action Valid@1
  definition: Fraction of initial top-1 proposals that are structurally and lexically playable.
  why_it_matters: Isolates protocol and lexical reliability.
  direction: higher
initial_action_valid_at_3:
  title: Action Valid@3
  definition: Fraction of all initial top-three suggestions that are structurally and lexically playable.
  why_it_matters: Measures breadth of playable suggestions.
  direction: higher
constraint_consistent_at_1:
  title: Constraint Consistent@1
  definition: Fraction of action-valid initial top-1 guesses consistent with every prior feedback row.
  why_it_matters: Isolates cumulative constraint maintenance from lexical validity.
  direction: higher
  caveats: [Later histories can differ between normal and strict mode.]
constraint_consistent_at_3:
  title: Constraint Consistent@3
  definition: Fraction of action-valid initial top-three suggestions consistent with every prior feedback row.
  why_it_matters: Measures constraint fidelity across the complete ranked proposal.
  direction: higher
strict_valid_at_1:
  title: Strict Valid@1
  definition: Fraction of all initial top-1 proposals that are both action-valid and constraint-consistent.
  why_it_matters: Preserves comparability with the earlier combined validity concept.
  direction: higher
strict_valid_at_3:
  title: Strict Valid@3
  definition: Fraction of all initial top-three slots that are action-valid and constraint-consistent.
  why_it_matters: Measures complete strict compliance across suggestions.
  direction: higher
ig_efficiency:
  title: Normalized IG efficiency
  definition: Played top-1 information gain divided by the mode-specific optimal oracle gain.
  why_it_matters: Measures strategic information seeking relative to the permitted action space.
  direction: higher
  caveats: [Normal uses the legal oracle; strict uses the constraint-consistent oracle.]
search_regret:
  title: Search regret
  definition: Oracle gain minus the best eligible gain found in the initial top three.
  why_it_matters: Measures failure to generate a strong option.
  direction: lower
ranking_regret:
  title: Ranking regret
  definition: Best eligible top-three gain minus top-1 gain.
  why_it_matters: Measures whether a better generated option was ranked below the action.
  direction: lower
total_regret:
  title: Total regret
  definition: Oracle gain minus played top-1 gain.
  why_it_matters: Captures combined search and ranking loss.
  direction: lower
repair_success_rate:
  title: Repair success
  definition: Fraction of repair attempts that produce an action passing the selected mode's play gate.
  why_it_matters: Measures recovery after verifier rejection.
  direction: higher
forfeit_rate:
  title: Forfeit rate
  definition: Failed repairs divided by decision rounds.
  why_it_matters: Measures feedback lost to unplayable responses.
  direction: lower
solve_penalty:
  title: Enforcement solve penalty
  definition: Solve@6 in normal mode minus Solve@6 in strict mode.
  why_it_matters: Measures performance lost when cumulative consistency is enforced.
  direction: lower
score_penalty:
  title: Enforcement score penalty
  definition: Mean strict score minus mean normal score.
  why_it_matters: Measures score degradation caused by strict enforcement.
  direction: lower
penalty_reduction:
  title: Reasoning penalty reduction
  definition: Baseline enforcement penalty minus medium-reasoning enforcement penalty.
  why_it_matters: Tests whether reasoning reduces the cost of strict enforcement.
  direction: higher
mean_reasoning_tokens_per_game:
  title: Reasoning tokens/game
  definition: Mean provider-reported reasoning tokens per completed game.
  why_it_matters: Measures realized inference-time reasoning compute.
  direction: contextual
mean_cost_usd_per_game:
  title: Cost/game
  definition: Mean configured estimated provider cost per completed game.
  why_it_matters: Supports performance-versus-cost comparisons.
  direction: lower
mean_latency_ms_per_game:
  title: Latency/game
  definition: Mean accumulated response latency per completed game.
  why_it_matters: Measures wall-clock inference burden inside a game.
  direction: lower
