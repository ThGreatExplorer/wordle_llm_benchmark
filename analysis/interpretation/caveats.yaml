partial_coverage:
  title: Partial coverage
  text: Results are provisional until every referenced run and paired comparison is complete.
mode_histories:
  title: Mode-dependent histories
  text: Strict rejection can suppress feedback, so later normal and strict interaction histories may diverge.
dynamic_unpaired:
  title: Dynamic comparison
  text: Historical and dynamic games are independent samples; their contrast is not paired by game ID.
hosted_nondeterminism:
  title: Hosted inference
  text: Temperature settings do not guarantee deterministic hosted inference.
