[project]
name = "wordle-llm-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Yu", email = "ThGreatExplorer@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0.0",
    "pyyaml>=6.0.3",
    "wordfreq>=3.1.1",
]

[project.scripts]
wordle-llm-benchmark = "benchmark.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "benchmark"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
